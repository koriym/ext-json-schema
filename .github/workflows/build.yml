name: Build and Test PHP Extension

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl

      - name: Install build tools and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bison re2c valgrind

      - name: Prepare build
        run: |
          phpize
          ./configure
          make

      - name: Run PHPT tests
        id: run_tests
        run: make test

      - name: Run JSON Schema Test Suite
        run: php -dextension=./modules/json_schema.so run_test_suite.php

      - name: Install Composer dependencies
        run: composer install --no-progress

      - name: Run PHPUnit tests
        run: php -dextension=./modules/json_schema.so vendor/bin/phpunit

      - name: Run smoke test
        run: php -dextension=./modules/json_schema.so smoke.php

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.php-version }}
          path: |
            tests/*.log
            tests/*.sh
          if-no-files-found: warn
